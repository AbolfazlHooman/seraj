name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - 'android-res/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set build number
        run: |
          sed -i "s/var APP_BUILD=0;/var APP_BUILD=${{ github.run_number }};/" www/index.html
          grep -q "var APP_BUILD=${{ github.run_number }};" www/index.html

      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_B64 is missing (see README)"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app icon
        run: cp -r android-res/. android/app/src/main/res/

      - name: Sync web assets
        run: npx cap sync android

      - name: Set app version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk seraj.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seraj-apk
          path: seraj.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" seraj.apk \
            --title "سراج - نسخهٔ ${{ github.run_number }}" \
            --notes "نسخهٔ خودکار شمارهٔ ${{ github.run_number }}" \
            --latest
